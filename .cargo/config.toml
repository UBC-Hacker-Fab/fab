[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
# Uncomment the line for which flash method you are using
runner = "picotool load -uvx -t elf" # USB
# runner = "probe-rs run --chip RP235x" # Debug probe

[alias]
lint = ["clippy", "--workspace", "--bins", "--examples", "--", "-D", "warnings"]
lint-host = ["clippy", "--target", "host-tuple", "-p", "communication", "--all-targets", "--", "-D", "warnings"]
test-host = "test --target host-tuple -p communication"

[env]
DEFMT_LOG = "debug"
